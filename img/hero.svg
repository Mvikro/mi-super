<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="720" height="300" fill="url(#bg)"/>
  <rect width="720" height="300" fill="url(#grid)"/>
  <rect width="720" height="300" fill="url(#glow)"/>

  <!-- Bolsas / productos en grises -->
  <g transform="translate(440 52)">
    <rect x="30" y="20" width="46" height="70" rx="8" fill="#3a3a40"/>
    <rect x="38" y="8" width="30" height="16" rx="4" fill="#4a4a52"/>
    <rect x="84" y="36" width="58" height="54" rx="10" fill="#2c2c31"/>
    <circle cx="113" cy="58" r="12" fill="#ff7a1a" fill-opacity="0.85"/>
    <rect x="150" y="0" width="34" height="90" rx="7" fill="#45454c"/>
    <rect x="156" y="18" width="22" height="8" rx="3" fill="#ff7a1a"/>
    <rect x="190" y="44" width="44" height="46" rx="22" fill="#34343a"/>
  </g>

  <!-- Carrito naranja -->
  <g fill="none" stroke="#ff7a1a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 70h36l30 120h182l26-96H430"/>
    <path d="M454 160h176"/>
  </g>
  <circle cx="470" cy="226" r="16" fill="#0b0b0c" stroke="#ff7a1a" stroke-width="9"/>
  <circle cx="612" cy="226" r="16" fill="#0b0b0c" stroke="#ff7a1a" stroke-width="9"/>

  <!-- Detalles: palomitas de lista -->
  <g stroke="#5a5a62" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M60 70l10 10 18-20"/><path d="M104 72h90"/>
