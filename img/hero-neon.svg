<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142a"/>
      <stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.74" cy="0.45" r="0.42">
      <stop offset="0" stop-color="#ff1080" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff1080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#0091b9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0091b9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0091b9" stroke-opacity="0.08"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="300" fill="url(#bg)"/>
  <rect width="720" height="300" fill="url(#grid)"/>
  <rect width="720" height="300" fill="url(#glowBlue)"/>
  <rect width="720" height="300" fill="url(#glowPink)"/>

  <!-- Cosas de todo tipo dentro del carrito -->
  <g transform="translate(440 52)">
    <rect x="34" y="22" width="34" height="68" rx="8" fill="#1d2138"/>
    <rect x="42" y="8" width="18" height="18" rx="4" fill="#262b47"/>
    <rect x="76" y="36" width="60" height="54" rx="8" fill="#171a2e"/>
    <path d="M92 38v-8a14 14 0 0 1 28 0v8" fill="none" stroke="#2f3556" stroke-width="5" stroke-linecap="round"/>
    <circle cx="106" cy="62" r="10" fill="#0091b9" filter="url(#neon)"/>
    <path d="M150 34h36l-8-26h-20z" fill="#232843"/>
    <rect x="165" y="34" width="6" height="44" fill="#232843"/>
    <rect x="152" y="78" width="32" height="12" rx="4" fill="#232843"/>
    <g transform="rotate(-35 216 60)">
      <rect x="211" y="40" width="10" height="50" rx="4" fill="#1b1f35"/>
      <path d="M204 28a14 14 0 1 0 24 0l-6 8h-12z" fill="#1b1f35"/>
    </g>
  </g>

  <!-- Carrito neón rosa -->
  <g fill="none" stroke="#ff1080" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <path d="M380 70h36l30 120h182l26-96H430"/>
    <path d="M454 160h176"/>
  </g>
  <g filter="url(#neon)">
    <circle cx="470" cy="226" r="16" fill="#08090f" stroke="#0091b9" stroke-width="9"/>
    <circle cx="612" cy="226" r="16" fill="#08090f" stroke="#0091b9" stroke-width="9"/>
  </g>

  <!-- Palomitas de lista -->
  <g stroke="#3a4170" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M60 70l10 10 18-20"/><path d="M104 72h90"/>
    <path d="M60 112l10 10 18-20"/><path d="M104 114h70"/>
  </g>
</svg>
