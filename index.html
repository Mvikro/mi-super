<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Mi lista de compras personal, sin conexión y sin permisos.">
  <title>Mi Súper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img src="img/hero.svg" alt="" class="hero-img" width="720" height="300">
    <div class="hero-text">
      <h1>Mi Súper</h1>
      <p id="counter">Lista vacía</p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-list" aria-selected="true">Mi lista</button>
    <button role="tab" id="tab-shop" aria-selected="false">🛒 En el súper</button>
  </nav>

  <main>
    <!-- MODO LISTA: agregar y organizar -->
    <section id="view-list">
      <form id="add-form" autocomplete="off">
        <div class="add-row">
          <input id="item-name" type="text" placeholder="¿Qué necesitas?" maxlength="60" enterkeyhint="done" aria-label="Producto">
          <input id="item-qty" type="text" placeholder="Cant." maxlength="12" aria-label="Cantidad" inputmode="text">
          <button type="submit" class="btn-add" aria-label="Agregar">+</button>
        </div>
        <div class="cats" id="cat-picker" aria-label="Pasillo"></div>
      </form>

      <div id="suggestions" class="suggestions" hidden>
        <h3>Compras frecuentes</h3>
        <div class="chips" id="suggestion-chips"></div>
      </div>

      <div id="list-groups"></div>
      <p class="empty" id="empty-list" hidden>Tu lista está vacía.<br>Escribe arriba lo que necesitas.</p>
    </section>

    <!-- MODO SÚPER: letra grande, solo tocar para tachar -->
    <section id="view-shop" hidden>
      <div id="shop-groups"></div>
      <p class="empty" id="empty-shop" hidden>No hay nada pendiente. 🎉</p>
      <div id="cart-section" hidden>
        <h3 class="cart-title">En el carrito <span id="cart-count"></span></h3>
        <div id="cart-items"></div>
        <button id="finish-btn" class="btn-finish">Terminar compra</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo">Deshacer</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
